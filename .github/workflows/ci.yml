name: CI

on:
  # No paths-ignore on pull_request: required checks never report if the workflow is skipped, which blocks
  # Markdown-only PRs. Jobs skip themselves via the `changes` job instead, and skipped jobs count as passing.
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md' #don't trigger CI for a Markdown file change
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    name: "Lint"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        run: pipx install rust-just

      - name: Install python or load from cache with dependencies
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: just install

      - name: Run linting
        run: just lint-all

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    name: "Test"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        run: pipx install rust-just

      - name: Install python or load from cache with dependencies
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: just install-transformers

      - name: Run tests
        run: just test -vv

  deploy_prefect_sandbox:
    name: "Sandbox"
    needs: changes
    uses: ./.github/workflows/prefect_deploy.yml
    with:
      aws-env: sandbox
      # Skip inside the called workflow rather than with a job-level `if:` here, so the required
      # "Sandbox / deploy" check still reports (as skipped) instead of pending forever
      skip: ${{ needs.changes.outputs.code != 'true' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
